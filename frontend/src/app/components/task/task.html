<div
  class="task"
  [draggable]="task.position !== 1111"
  [attr.disabled]="task.position === 1111"
  [class.task-container]="task.position === 1111"
  (dragstart)="onDragStart()"
  (click)="openTaskModal()"
  [ngClass]="{ 'hover:bg-gray-400 cursor-pointer': getUserId() !== '4' }"
>
  <p>{{ task.title }}</p>
  <span>{{ getAssignee() }}</span>
</div>
