<app-container>
  <div class="each-column" (drop)="onDragDrop($event)" (dragover)="onDragOver($event)">
    <p class="font-bold mb-4 text-center">{{ getColumnNames() }}</p>
    @for (task of tasks; track task) {
      @if (task.position === columnName) {
        <app-each-task [task]="task"></app-each-task>
      }
    }
    <app-add-new-task></app-add-new-task>
  </div>
</app-container>
