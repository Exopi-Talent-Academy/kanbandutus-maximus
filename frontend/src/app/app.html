<app-container>
  <app-nav-bar></app-nav-bar>
  <app-header></app-header>
  <app-board></app-board>
</app-container>

@if (isEditable()) {
  <div class="shadow">
    <div class="modal">
      <div class="task-form relative">
        <span class="close-button" (click)="cancelEdit()">x</span>
        <app-task-form [currentTask]="task()"></app-task-form>
      </div>
    </div>
  </div>
}
