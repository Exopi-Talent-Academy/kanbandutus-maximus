<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .box { fill: #f0f0f0; stroke: #333; stroke-width: 2; }
      .box-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; }
      .box-detail { font-family: Arial, sans-serif; font-size: 11px; }
      .arrow { marker-end: url(#arrowhead); stroke: #666; stroke-width: 2; fill: none; }
      .label { font-family: Arial, sans-serif; font-size: 11px; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#fff"/>

  <!-- External Clients -->
  <rect x="250" y="20" width="300" height="40" rx="5" fill="#e8d4e8" stroke="#8b4588" stroke-width="2"/>
  <text x="400" y="45" text-anchor="middle" class="box-title">External Clients (HTTP)</text>

  <!-- FastAPI Application Layer -->
  <rect x="250" y="90" width="300" height="180" rx="10" fill="#d4e8f4" stroke="#2a6f9e" stroke-width="2"/>
  <text x="400" y="115" text-anchor="middle" class="box-title">FastAPI Application (main.py)</text>
  <line x1="270" y1="125" x2="530" y2="125" stroke="#ccc" stroke-width="1"/>
  <text x="280" y="140" class="box-detail">• REST Endpoints (GET, POST, PUT, DELETE)</text>
  <text x="280" y="155" class="box-detail">• Pydantic Request/Response Models</text>
  <text x="280" y="170" class="box-detail">• HTTP Exception Handling</text>
  <text x="280" y="185" class="box-detail">• NotFoundError Handler</text>
  <text x="280" y="200" class="box-detail">• Board/Column/Task CRUD</text>
  <text x="280" y="215" class="box-detail">• API: /api/boards, /api/columns, /api/tasks</text>

  <!-- Arrow from clients to API -->
  <path d="M400,60 L400,90" class="arrow"/>

  <!-- KanbanService Layer -->
  <rect x="280" y="300" width="240" height="120" rx="10" fill="#e8f4e8" stroke="#3a8a3a" stroke-width="2"/>
  <text x="400" y="325" text-anchor="middle" class="box-title">KanbanService (service.py)</text>
  <line x1="295" y1="335" x2="505" y2="335" stroke="#ccc" stroke-width="1"/>
  <text x="295" y="355" class="box-detail">• Business Logic</text>
  <text x="295" y="370" class="box-detail">• Entity Validation</text>
  <text x="295" y="385" class="box-detail">• NotFoundError Exceptions</text>
  <text x="295" y="400" class="box-detail">• Board/Column/Task Operations</text>

  <!-- Arrow from API to Service -->
  <path d="M400,270 L400,300" class="arrow"/>

  <!-- Storage Layer -->
  <rect x="280" y="450" width="240" height="100" rx="10" fill="#f4e8d4" stroke="#a67c00" stroke-width="2"/>
  <text x="400" y="475" text-anchor="middle" class="box-title">Storage Layer (storage.py)</text>
  <line x1="295" y1="485" x2="505" y2="485" stroke="#ccc" stroke-width="1"/>
  <text x="295" y="505" class="box-detail">• StorageInterface (Abstract)</text>
  <text x="295" y="520" class="box-detail">• JsonStorage (Implementation)</text>

  <!-- Arrow from Service to Storage -->
  <path d="M400,420 L400,450" class="arrow"/>

  <!-- Models Layer -->
  <rect x="50" y="300" width="180" height="120" rx="10" fill="#f4d4d4" stroke="#a83a3a" stroke-width="2"/>
  <text x="140" y="325" text-anchor="middle" class="box-title">Data Models (models.py)</text>
  <line x1="65" y1="335" x2="215" y2="335" stroke="#ccc" stroke-width="1"/>
  <text x="65" y="355" class="box-detail">• Board (dataclass)</text>
  <text x="65" y="370" class="box-detail">• Column (dataclass)</text>
  <text x="65" y="385" class="box-detail">• Task (dataclass)</text>
  <text x="65" y="400" class="box-detail">• KanbanData (container)</text>

  <!-- Arrow from Service to Models -->
  <path d="M280,360 L230,360" class="arrow"/>

  <!-- Config Module -->
  <rect x="570" y="300" width="180" height="60" rx="10" fill="#d4d4f4" stroke="#5a5a8f" stroke-width="2"/>
  <text x="660" y="325" text-anchor="middle" class="box-title">Config (config.py)</text>
  <line x1="585" y1="335" x2="735" y2="335" stroke="#ccc" stroke-width="1"/>
  <text x="585" y="350" class="box-detail">• Data directory path</text>
  <text x="585" y="365" class="box-detail">• JSON file location</text>

  <!-- Arrow from API to Config -->
  <path d="M550,330 L570,330" class="arrow"/>

  <!-- Frontend Module -->
  <rect x="570" y="400" width="180" height="60" rx="10" fill="#e8d4f4" stroke="#8b4588" stroke-width="2"/>
  <text x="660" y="425" text-anchor="middle" class="box-title">Frontend (frontend.py)</text>
  <line x1="585" y1="435" x2="735" y2="435" stroke="#ccc" stroke-width="1"/>
  <text x="585" y="450" class="box-detail">• FrontendInterface (Abstract)</text>
  <text x="585" y="465" class="box-detail">• AngularMock (Implementation)</text>

  <!-- Arrow from API to Frontend -->
  <path d="M550,400 L570,420" class="arrow"/>

  <!-- JSON File -->
  <rect x="360" y="560" width="80" height="30" rx="5" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="400" y="580" text-anchor="middle" class="box-detail">kanban.json</text>

  <!-- Arrow from Storage to JSON -->
  <path d="M400,550 L400,560" class="arrow"/>

</svg>