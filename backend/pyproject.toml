[project]
name = "kanban"
version = "0.1.0"
description = "Minimalistic Kanban Board API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "gunicorn (>=25.3.0,<26.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.26.0",
    "ruff>=0.9.0",
    "pylint>=3.0.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "flake8>=7.0.0",
]

[project.scripts]
kanban-reimport-json = "kanban.cli:reimport_json_to_sqlite_cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "0*_test_*.py"]
python_functions = ["test_*"]